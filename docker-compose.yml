services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: riourbe
      POSTGRES_PASSWORD: riourbe
      POSTGRES_DB: riourbe
    # Só localhost — o banco nunca precisa ficar acessível na rede, mesmo
    # quando backend/frontend abaixo são abertos para outros PCs acessarem.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - riourbe_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riourbe -d riourbe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://riourbe:riourbe@db:5432/riourbe
    # Sem "127.0.0.1:" na frente — fica acessível também por outros PCs da
    # mesma rede local, não só pelo próprio computador.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_admin &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8000
    # Idem — acessível por outros PCs da rede, não só localhost. As
    # chamadas /api do navegador passam pelo proxy do Vite (vite.config.ts)
    # até o backend, então não precisa mexer em CORS nem em cookie.
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  riourbe_db_data:
